version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: green-justice-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: green_justice
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./Backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: green-justice-api
    restart: always
    depends_on:
      - mysql
    environment:
      PORT: 5001
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: green_justice
      DB_PORT: 3306
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: supersecretjwtkey
    ports:
      - "5001:5001"

  frontend:
    build:
      context: ./Front-end
      dockerfile: Dockerfile
    container_name: green-justice-ui
    restart: always
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:5001/api
    ports:
      - "3000:80"

volumes:
  db_data:
